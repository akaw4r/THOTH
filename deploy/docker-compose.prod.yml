# PRODUCTION overlay. Use together with the base compose file:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# Requires in the .env: THOTH_DOMAIN, ACME_EMAIL, BASE_URL=https://YOUR-DOMAIN,
# GOOGLE_CLIENT_ID/SECRET, and strong SESSION_SECRET, ENCRYPTION_KEY.

services:
  api:
    environment:
      NODE_ENV: production
    restart: always

  worker:
    environment:
      NODE_ENV: production
    restart: always

  # In production, Caddy publishes 80/443 and handles TLS automatically.
  # `!override` replaces (does not append to) the base compose port mapping.
  proxy:
    ports: !override
      - '80:80'
      - '443:443'
    volumes:
      - ../deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      THOTH_DOMAIN: ${THOTH_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}

  db:
    restart: always

  redis:
    restart: always
