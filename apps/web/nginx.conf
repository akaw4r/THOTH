# Port 8080 (unprivileged): the runtime image runs as a non-root user
# (nginx-unprivileged) — good practice in general.

# Security at the origin: on the platform there is no Caddy in front (helmet only
# covers /api), so nginx itself protects the SPA. HSTS is ignored by the browser
# over http:// (local dev) and effective behind the platform's TLS.
#
# NOTE (nginx semantics): add_header is NOT inherited by a location that
# declares its own add_header — that's why the security block is repeated in
# the locations that set Cache-Control. If you add a new location with
# add_header, repeat the security block in it.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

  # Compression (the base image ships with gzip off)
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;

  # cache hashed assets (repeats the security headers: see NOTE above)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    try_files $uri =404;
  }

  # Health check for Kubernetes probes (liveness/readiness/startup).
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # SPA fallback: any React route returns index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # do not cache the entry HTML (repeats the security headers: see NOTE)
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
  }
}
